name: Eduwide
description: "HNDIT 4232 Project - Login Portal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  intl: ^0.20.2
  timezone: ^0.10.1
  image_picker: ^1.2.0
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo/logo.png
    - assets/logo/logo-2.png
    - assets/logo/app-icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/app-icon.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/logo/app-icon.png